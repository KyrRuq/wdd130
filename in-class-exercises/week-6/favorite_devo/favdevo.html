<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder David A. Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYU Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Perry Rockwood</td>
            <td>When Sorrow Meets the Savior</td>
            <td>BYU Idaho</td>
            <td>2025</td>
          </tr>
          <tr>
            <td>Elder Karl Hirst</td>
            <td>Repentance at Its Fullest</td>
            <td>BYU Idaho</td>
            <td>2025</td>
          </tr>
         </table>

         <form>
          <label for="speaker-name">Speaker: </label>
          <input type="text" id="speaker-name" required>

          <label for="title">Title: </label>
          <input type="text" id="title">

          <label for="location"> Location: </label>
          <input type="text" id="location">

          <label for="year">Year: </label>
          <input type="text" id="year" maxlength="4">

          <input type="submit">
         </form>
         Add your table and your form here.
      </div>
    </main>
  </div>
</body>
</html>
