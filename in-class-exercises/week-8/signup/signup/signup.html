<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #myForm {
            max-width: 400px;
            height: 550px;
            background-color: white;
            align-items: center;
            justify-items: center;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 7px solid darkblue;
            border-radius: 25px;
            overflow: hidden;
        }

        #closeBtn {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        section {
            grid-column: 1/3;
        }

        h1, h2, h3 {
            grid-column: 1/3;
        }

        #books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-column: 1/3;
            align-self: end;
        }

        .bottom-books {
            width: 80px;
            height: 120px;
            padding: 0px 3px 0px 0px;
        }

        /* #pearl {
            border-radius: 0px 0px 20px 0px;
        }

        #old {
            border-radius: 0px 0px 0px 20px;
        } */

        #jesus-words {
            grid-column: 1/3;
            height: 170px;
            background: url(images/jesus_feeds_5000.jpeg) center / cover;
            justify-self: stretch;
            align-self: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 3px black;
        }

    </style>




</head>

<body>
    <div id="formContainer">
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>

            <div id="jesus-words">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>

            <h3>Sign Up for Daily Scripture Feed</h3>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

            <div id="books">
                <img class="bottom-books" id="old" src="images/old_testament.webp">
                <img class="bottom-books" src="images/new_testament.webp">
                <img class="bottom-books" src="images/book_of_mormon.webp">
                <img class="bottom-books" src="images/doctrine_and_covenants.webp">
                <img class="bottom-books" id="pearl" src="images/pearl_of_great_price.webp">
            </div>
        </form>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
