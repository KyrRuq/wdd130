<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        img {
            border-radius: 600px;
            border: 6px solid #FFFFFE;
            aspect-ratio: 1/1;
            object-fit: cover;
            object-position: top;
            width: 100%;
        }

        body {
            background-color: #E8ECED;
            font-family: Arial;
            margin:0;
            padding: 40px 20px;
        }
        
        .twelve_apostles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .first_presidency {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        h2.twelve {
            font-size: 25px;
            margin-top: 25px;
        }

        h2.first {
            font-size: 28px;
        }

        h2 {
            color: #FFFFFE;
            text-align: center;
        }

        .overall {
            max-width: 800px;
            background-image: url("images/christus.webp");
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
            padding: 10px 20px 30px 20%;
            border-radius: 30px;
            border: 6px solid #000;
        }
    </style>
</head>
<body>
    <div class="overall">
        <!-- Insert HTML elements here -->
         <h2 class="first">First Presidency</h2>
        <div class="first_presidency">
            <img src="images\eyring.webp" alt="Eyring Smiling">
            <img src="images\oaks.webp" alt="Oaks Smiling">
            <img src="images\christofferson.webp" alt="Christofferson Smiling">
        </div>    
        <h2 class="twelve">Quorum of the Twelve Apostles</h2>
        <div class="twelve_apostles">
                <img src="images\uchtdorf.webp" alt="Uchtdorf Smiling">
                <img src="images\bednar.webp" alt="Bednar Smiling">
                <img src="images\cook.webp" alt="Cook Smiling">
                <img src="images\anderson.webp" alt="Anderson Smiling">
                <img src="images\rasband.webp" alt="Rasband Smiling">
                <img src="images\stevenson.webp" alt="Stevenson Smling">
                <img src="images\renlund.webp" alt="Renlund Smiling">
                <img src="images\gong.webp" alt="Gong Smiling">
                <img src="images\soares.webp" alt="Soares Smiling">
                <img src="images\kearon.webp" alt="Kearon Smiling">
                <img src="images\causse.webp" alt="Cause Smiling">
                <img src="images\gilbert.webp" alt="Gilbert Smiling">
        </div>
    </div>    
</body>
</html>
